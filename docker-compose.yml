version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY
      - PINECONE_API_KEY
      - PINECONE_ENV
      - PINECONE_INDEX
    volumes:
      - ./backend:/app

